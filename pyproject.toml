[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cartography-nais"
version = "0.1.0"
description = "Nais collector for upstream Cartography"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["cartography>=0.143.0"]

[project.optional-dependencies]
test = ["pytest>=8", "testcontainers[neo4j]>=4.15"]

[project.scripts]
cartography-nais = "cartography_nais.cli:main"

[tool.setuptools.packages.find]
include = ["cartography_nais*"]

[tool.setuptools.package-data]
"cartography_nais.analysis" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
