apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: cartography-github
  namespace: appsec
  labels:
    team: appsec
spec:
  # Manual runs only during the baseline comparison: February 31 never occurs.
  # Restore "5 06,18 * * *" afterwards.
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Forbid
  image: "${IMAGE}"
  backoffLimit: 2
  successfulJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 1800
  command:
    - cartography-github
    - --neo4j-uri
    - bolt://neo4j-bolt.appsec.svc.cluster.local
    - --neo4j-user
    - neo4j
    - --neo4j-password-env-var
    - NEO4J_PASSWORD
    - --github-config-env-var
    - GITHUB_CONFIG
    - --no-fetch-cache
  envFrom:
    - secret: cartography
  env:
    - name: OTEL_LOGS_EXPORTER
      value: otlp
  accessPolicy:
    outbound:
      rules:
        - application: neo4j
      external:
        - host: github.com
        - host: api.github.com
  observability:
    autoInstrumentation:
      enabled: true
      runtime: python
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 3072Mi
