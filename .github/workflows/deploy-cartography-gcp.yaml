name: Deploy cartography (GCP)
on:
  workflow_dispatch:
   inputs:
     image:
       type: string
       required: true
       description: 'Image to deploy'

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@fceb26518aacf0ca378decec413782d1c5926e1a # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/cartography-gcp.yaml
          IMAGE: ${{ inputs.image }}
