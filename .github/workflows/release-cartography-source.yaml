name: Release a Cartography source

on:
  workflow_call:
    inputs:
      repository:
        description: GitHub repository containing the source
        required: true
        type: string
      source:
        description: Branch, tag, or latest for the latest stable GitHub release
        required: true
        type: string
      targets:
        description: JSON array of collector and cluster pairs
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ inputs.repository }}@${{ inputs.source }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          SOURCE: ${{ inputs.source }}
        run: |
          ref="$SOURCE"
          if [ "$ref" = latest ]; then
            ref="$(gh release view --repo "$REPOSITORY" --json tagName --jq .tagName)"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795
        id: build
        with:
          team: appsec
          dockerfile: Dockerfile.cartography
          docker_context: source
          image_suffix: ${{ inputs.source }}
          cache_from: type=gha,scope=cartography-${{ inputs.source }}
          cache_to: type=gha,mode=max,scope=cartography-${{ inputs.source }}
          pull: true
      - name: Smoke-test the published image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: docker run --rm "$IMAGE" --help > /dev/null
      - name: Record release
        env:
          REPOSITORY: ${{ inputs.repository }}
          SOURCE: ${{ steps.source.outputs.ref }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          printf '### %s@%s\n\nSource commit: %s\n\nImage: %s\n' \
            "$REPOSITORY" "$SOURCE" "$(git -C source rev-parse HEAD)" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.collector }} to ${{ matrix.cluster }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@v1
        with:
          team: appsec
      - name: Load Kubernetes variables
        if: matrix.collector == 'k8s'
        run: yq -r 'to_entries | .[] | .key + "=" + .value' "$VARS" >> "$GITHUB_ENV"
        env:
          VARS: .nais/vars-k8s-${{ matrix.cluster }}.yaml
      - name: Deploy to Nais
        run: |
          IMAGE="${IMAGE:?}" envsubst < "$RESOURCE" > "$RUNNER_TEMP/manifest.yaml"
          nais apply "$RUNNER_TEMP/manifest.yaml" --environment "$CLUSTER" --wait
        env:
          CLUSTER: ${{ matrix.cluster }}
          RESOURCE: .nais/cartography-${{ matrix.collector }}.yaml
          IMAGE: ${{ needs.build.outputs.image }}
