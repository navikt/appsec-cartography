name: Build & deploy Cartography

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.cartography
      - pyproject.toml
      - cartography_nais/**
      - cartography_github/**
      - tests/**
      - .github/workflows/build-deploy-cartography.yaml
      - .github/workflows/release-cartography-source.yaml
      - .nais/cartography-*.yaml
      - .nais/vars-k8s-*.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cartography
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: cartography-cncf/cartography
            source: latest
            targets:
              - {collector: gcp, cluster: prod-gcp}
              - {collector: nais, cluster: prod-gcp}
              - {collector: k8s, cluster: dev-fss}
              - {collector: k8s, cluster: dev-gcp}
              - {collector: k8s, cluster: prod-fss}
              - {collector: k8s, cluster: prod-gcp}
          - repository: cartography-cncf/cartography
            source: master
            targets:
              - {collector: github, cluster: prod-gcp}
    uses: ./.github/workflows/release-cartography-source.yaml
    with:
      repository: ${{ matrix.repository }}
      source: ${{ matrix.source }}
      targets: ${{ toJSON(matrix.targets) }}
