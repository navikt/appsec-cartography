name: Bootstrap Neo4j storage
on:
  workflow_dispatch:

jobs:
  bootstrap:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@v1
        with:
          team: appsec
      - name: Apply storage manifest
        run: nais apply .nais/neo4j-pvc.yaml --environment prod-gcp
