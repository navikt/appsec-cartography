name: Deploy PVC alerts
on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@v1.0.3
        with:
          team: appsec
      - name: Apply alert rules
        run: nais apply .nais/pvc-alerts.yaml --environment prod-gcp
